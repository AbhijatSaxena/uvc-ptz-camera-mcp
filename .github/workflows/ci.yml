name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # the floor we claim: the linter's target must match it
      - run: python -m pip install --quiet ruff
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor version runs for real. A local venv on a newer interpreter cannot catch a
        # rule that autofixes into 3.11-only syntax, and this package claims 3.10.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --quiet --upgrade pip
      - run: python -m pip install --quiet -e . numpy pytest pytest-asyncio
      - run: python -m pytest -q

  versions:
    # Package metadata, the version constant inside the code, the registry manifest and the
    # bundle manifest each carry a copy of the version. The constant is the one that drifts
    # silently: nothing reads it until a host asks, so a server reporting the previous release
    # while every manifest says the new one is a lie about which build is running.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: every copy of the version must agree
        run: python scripts/check_versions.py

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: validate the bundle manifest and its icon
        run: npx --yes @anthropic-ai/mcpb@latest validate mcpb/manifest.json
      - name: pack it, and report what is inside
        run: |
          npx --yes @anthropic-ai/mcpb@latest pack mcpb bundle.mcpb
          npx --yes @anthropic-ai/mcpb@latest info bundle.mcpb

  wheel:
    # Install the built wheel into a fresh environment and start the server from it. The source
    # tree cannot catch a runtime dependency that is imported unconditionally but declared
    # optional: the development virtualenv already has the package, so every test passes while a
    # clean install of the released artifact dies at the first import. That happened here with
    # numpy, and the console script -- the thing users actually run -- was what broke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet build
      - run: python -m build --wheel --outdir dist
      - run: python scripts/check_wheel.py
      - name: install into a clean environment and start the server from the installed wheel
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --quiet --upgrade pip
          /tmp/clean/bin/python -m pip install --quiet dist/*.whl
          /tmp/clean/bin/uvc-ptz-mcp --version
          python scripts/handshake.py /tmp/clean/bin/python

  manifest:
    # The registry enforces rules that no local check knows about -- a description longer than 100
    # characters is rejected by the registry and by nothing earlier, so it is discovered at publish
    # time, after a tag exists and a release has been created. Validating here moves that discovery
    # to the commit that caused it. Needs no credentials: validate only reads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate server.json against the live registry
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate

  # There is deliberately no hardware job here. The real backend drives a USB camera over
  # DirectShow, and a hosted runner has no camera, no Windows host and nothing to point at -- a
  # "live" job would only ever assert that the simulator works, which the test matrix already
  # does four times. The hardware path is exercised on a developer machine, and the README says
  # plainly what that covers and what it does not.

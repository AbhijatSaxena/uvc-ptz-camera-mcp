name: publish

# Released by pushing a tag: no repository secret is needed, because PyPI trusted publishing and
# the MCP registry's github-oidc login both accept an OIDC token from a tagged job.
#
# workflow_dispatch exists so a release can be re-run *without* rewriting the tag: a manifest fix
# (the registry enforces a description length, and it is the registry that says so, not any local
# check) should not require deleting and re-creating a tag that a GitHub release already points to.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet build twine
      - run: python -m build
      - name: the wheel must contain the package and nothing else
        run: python scripts/check_wheel.py
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: no token stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: published
        name: is this version already on PyPI?
        run: |
          if python scripts/on_pypi.py; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: published
        name: is this version already in the registry?
        run: |
          if python scripts/on_registry.py; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: publish the server manifest
        if: steps.published.outputs.skip == 'false'
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
